<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="data:,">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>grdpwasm — Web RDP Client</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #1a1a2e; color: #eee; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; }
    /* native-keyboard hidden input: inside the toolbar, absolutely positioned offscreen */
    #nativeKbInput {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
    }

    #toolbar {
      background: #16213e;
      padding: 8px 12px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      border-bottom: 1px solid #0f3460;
    }
    #toolbar label { font-size: 12px; color: #aaa; }
    #toolbar input {
      background: #0f3460;
      border: 1px solid #444;
      color: #eee;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 13px;
    }
    #toolbar input[type=number] { width: 70px; }
    #toolbar input[type=text], #toolbar input[type=password] { width: 130px; }
    #connectBtn {
      background: #e94560;
      color: white;
      border: none;
      padding: 5px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 13px;
      font-weight: bold;
    }
    #connectBtn:hover { background: #c73652; }
    #connectBtn.connected { background: #2ecc71; }
    #connectBtn.connected:hover { background: #27ae60; }
    #status { font-size: 12px; color: #aaa; margin-left: 8px; }

    /* fixedTarget mode: hide host/port (target comes from the server / URL param),
       the user only fills in credentials. standalone mode (no fixedTarget) shows all fields. */
    html.fixedTarget #hostField, html.fixedTarget #portField { display: none; }

    #canvasWrapper {
      flex: 1;
      overflow: auto;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      background: #000;
    }
    #rdpCanvas {
      display: block;
      cursor: none;
      outline: none;
      /* small screens: scale the canvas to the container width (aspect ratio kept) so a
         phone sees the whole desktop; pinch-zoom still zooms in. Mouse coords are
         rescaled accordingly. */
      max-width: 100%;
      height: auto;
    }

    /* ── virtual keyboard (small screens / touch devices) ────────────────────────── */
    #vkbToggle {
      background: #0f3460;
      color: #eee;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #vkbToggle:hover { background: #1b4a7e; }
    #vkbToggle.on { background: #2ecc71; color: #111; }
    /* ── shortcut bar (holding a chip presses the combo in order; release fires in reverse) ── */
    #scbToggle {
      background: #0f3460;
      color: #eee;
      border: 1px solid #444;
      padding: 5px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
    }
    #scbToggle:hover { background: #1b4a7e; }
    #scbToggle.on { background: #e94560; color: #fff; }
    #shortcuts {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      padding: 5px 12px;
      background: #16213e;
      border-bottom: 1px solid #0f3460;
    }
    #shortcuts[hidden] { display: none; }
    .scb-chip {
      background: #0f3460;
      color: #cfd8e3;
      border: 1px solid #2c4a77;
      border-radius: 14px;
      padding: 3px 10px;
      font-size: 11px;
      cursor: pointer;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    .scb-chip.scb-on { background: #e94560; color: #fff; border-color: #ff8fa3; }
    #sysKbBtn { background: #0f3460; color: #eee; border: 1px solid #444; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    #sysKbBtn:hover { background: #1b4a7e; }
    #sysKbBtn.on { background: #3498db; color: #111; }
    #vkbRoot {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 60;
      padding: 4px 6px;
      /* the virtual keyboard's own dark background (rgba); no extra overlay beneath */
    }
    body.vkb-open #canvasWrapper {
      padding-bottom: var(--vkb-hpx, 0px);
    }
  </style>
  <link rel="stylesheet" href="vendor/simple-keyboard.css" />
  <link rel="stylesheet" href="virtual-keyboard.css" />
</head>
<body>
  <script>
    // ── fixedTarget mode ──────────────────────────────────────────────
    // The target address is controlled by the server (rdp-bridge injects __rdpTarget);
    // the front end cannot tamper with it. FixedTarget mode (host/port hidden) is
    // triggered when either:
    //   1. __rdpTarget exists (injected by rdp-bridge)
    //   2. URL param ?fixedTarget=true (explicit)
    // Neither present = standalone mode: host/port fields shown for free connection.
    (function () {
      var isFixed = !!(window.__rdpTarget && window.__rdpTarget.host)
        || /[?&]fixedTarget=true/.test(location.search);
      if (isFixed) document.documentElement.classList.add("fixedTarget");
    })();
  </script>
  <div id="toolbar">
    <span id="connFields">
      <label>Domain</label>
      <input type="text" id="domain" value="" placeholder="(optional)" />
      <label>User</label>
      <input type="text" id="user" value="" />
      <label>Password</label>
      <input type="password" id="password" value="" />
    </span>
    <label>Width</label>
    <input type="number" id="width" value="1280" />
    <label>Height</label>
    <input type="number" id="height" value="800" />
    <label style="display:flex;align-items:center;gap:4px;cursor:pointer">
      <input type="checkbox" id="swapAltMeta" />
      Swap Alt/Meta
    </label>
    <!-- xrdp compat is fully automatic now: detected via the server bitmap-codecs capability set -->
    <button id="connectBtn" onclick="toggleConnect()">Connect</button>
    <button id="scbToggle" title="Shortcut bar (F1–F12 / Alt+Tab / Ctrl+Alt+T / ⊞ Win / ⇧+F10 …)">⚡</button>
    <button id="vkbToggle" title="Virtual keyboard (touch / small screens)">⌨️</button>
    <button id="sysKbBtn" title="System keyboard (native)">⌨️Sys</button>
    <button id="unlockBtn" title="Unlock: send Ctrl+Alt+Del → auto-type password → Enter (click this when the lock screen shows)" style="display:none">🔓</button>
    <button id="redrawBtn" title="Force a full server redraw (heals missing patches / blank regions)" style="display:none">🔄</button>
    <span id="status">Loading WASM…</span>
  </div>
  <div id="shortcuts" hidden></div>
  <div id="vkbRoot" class="vkb-hidden-root"></div>
  <input id="nativeKbInput" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  <div id="canvasWrapper">
    <canvas id="rdpCanvas" tabindex="0"></canvas>
  </div>

  <script src="wasm_exec.js"></script>
  <script src="vendor/justget.browser.js"></script>
  <script>
    const go = new Go();
    let connected = false;

    // ── Cookie helpers ────────────────────────────────────────────────────────
    function setCookie(name, value) {
      document.cookie = encodeURIComponent(name) + '=' + encodeURIComponent(value) +
        '; max-age=31536000; SameSite=Strict';
    }
    function getCookie(name) {
      const key = encodeURIComponent(name) + '=';
      for (const part of document.cookie.split(';')) {
        const s = part.trim();
        if (s.startsWith(key)) return decodeURIComponent(s.slice(key.length));
      }
      return null;
    }
    function loadCookies() {
      const fields = ['host', 'port', 'domain', 'width', 'height'];
      for (const id of fields) {
        const v = getCookie('rdp_' + id);
        if (v !== null) document.getElementById(id).value = v;
      }
      const sam = getCookie('rdp_swapAltMeta');
      if (sam !== null) document.getElementById('swapAltMeta').checked = (sam === '1');
    }
    function saveCookies() {
      for (const id of ['domain', 'width', 'height']) {
        const el = document.getElementById(id);
        if (el) setCookie('rdp_' + id, el.value.trim());
      }
      const sm = document.getElementById('swapAltMeta');
      if (sm) setCookie('rdp_swapAltMeta', sm.checked ? '1' : '0');
    }
    loadCookies();

    // ── Web Audio PCM scheduler ───────────────────────────────────────────────
    // AudioContext is created in doConnect() while a user gesture is active,
    // so it starts in 'running' state and avoids browser autoplay suspension.
    // Web Audio automatically resamples AudioBuffers to the context's rate,
    // so we never need to recreate the context when the server changes format.
    let audioCtx = null;
    let audioNextAt = 0;      // next scheduled start time (AudioContext seconds)
    const AUDIO_LOOKAHEAD = 0.15;  // 150 ms look-ahead to absorb WASM jitter
    const AUDIO_MAX_QUEUE = 2.0;   // reset schedule if >2 s ahead (prevents runaway)

    function rdpAudioPlay(sampleRate, channels, bitsPerSample, uint8Data) {
      if (!audioCtx || audioCtx.state === 'closed') return;

      const bytesPerSample = bitsPerSample >> 3;
      const numSamples = uint8Data.byteLength / (channels * bytesPerSample);
      if (numSamples === 0) return;

      // Create AudioBuffer at the server's sample rate.
      // Web Audio resamples automatically to the AudioContext rate.
      const audioBuf = audioCtx.createBuffer(channels, numSamples, sampleRate);

      // Fast native Int16 → Float32 deinterleave using TypedArray view.
      if (bitsPerSample === 16) {
        const int16 = new Int16Array(
          uint8Data.buffer, uint8Data.byteOffset, uint8Data.byteLength >> 1
        );
        for (let ch = 0; ch < channels; ch++) {
          const out = audioBuf.getChannelData(ch);
          for (let i = 0; i < numSamples; i++) {
            out[i] = int16[i * channels + ch] / 32768.0;
          }
        }
      } else if (bitsPerSample === 8) {
        for (let ch = 0; ch < channels; ch++) {
          const out = audioBuf.getChannelData(ch);
          for (let i = 0; i < numSamples; i++) {
            out[i] = (uint8Data[i * channels + ch] - 128) / 128.0;
          }
        }
      }

      const src = audioCtx.createBufferSource();
      src.buffer = audioBuf;
      src.connect(audioCtx.destination);

      const now = audioCtx.currentTime;
      if (audioNextAt < now + AUDIO_LOOKAHEAD) audioNextAt = now + AUDIO_LOOKAHEAD;
      if (audioNextAt > now + AUDIO_MAX_QUEUE)  audioNextAt = now + AUDIO_LOOKAHEAD;

      src.start(audioNextAt);
      // Use actual audioBuf duration (accounts for resampling rounding).
      audioNextAt += audioBuf.duration;
    }

    // ── WebCodecs H.264 decoder ───────────────────────────────────────────────
    // h264Dec is created fresh on each RDP connection and torn down on
    // disconnect.  Frames are drawn directly onto rdpCanvas via drawImage().
    let h264Dec = null;
    let h264Timestamp = 0; // monotonically increasing μs counter

    // Pending frame position keyed by timestamp (μs).
    const h264FramePos = new Map();

    function h264Supported() {
      return (typeof VideoDecoder !== 'undefined') &&
             (typeof EncodedVideoChunk !== 'undefined');
    }

    function createH264Decoder(width, height) {
      if (!h264Supported()) return null;
      const decoder = new VideoDecoder({
        output(frame) {
          const pos = h264FramePos.get(frame.timestamp);
          h264FramePos.delete(frame.timestamp);
          const x = pos ? pos.x : 0;
          const y = pos ? pos.y : 0;
          ctx2d.drawImage(frame, x, y);
          frame.close();
        },
        error(e) {
          console.warn('WebCodecs H.264 decoder error:', e);
        }
      });
      decoder.configure({
        codec: 'avc1.42E01E',   // H.264 Baseline (covers AVC420/444 from RDP)
        codedWidth: width,
        codedHeight: height,
        optimizeForLatency: true,
      });
      return decoder;
    }

    // Called from Go/WASM with raw H.264 NAL unit data.
    function rdpOnH264(destX, destY, w, h, isKey, uint8Data) {
      if (!h264Dec || h264Dec.state === 'closed') return;
      h264Timestamp += 1000; // 1 ms apart (decoder uses μs)
      h264FramePos.set(h264Timestamp, { x: destX, y: destY });
      try {
        h264Dec.decode(new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: h264Timestamp,
          data: uint8Data,
        }));
      } catch (e) {
        console.warn('rdpOnH264 decode error:', e);
      }
    }

    // ── Canvas / ctx2d ────────────────────────────────────────────────────────
    const canvas = document.getElementById('rdpCanvas');
    let ctx2d = canvas.getContext('2d');

    // ── Server-side mouse pointer ─────────────────────────────────────────────
    // The RDP server sends pointer shapes (with hotspots) and cache references.
    // We rasterise each shape to a PNG data URL once and apply it as the
    // canvas's CSS cursor; the browser composites it natively at the local
    // mouse position.  Pointer shapes are cached by server-assigned index;
    // pointer_cached PDUs just re-select an already-rendered shape.
    const pointerCache = new Map(); // idx → CSS cursor value

    function rdpOnPointerHide() {
      canvas.style.cursor = 'none';
    }

    function rdpOnPointerCached(idx) {
      const css = pointerCache.get(idx);
      if (css) canvas.style.cursor = css;
    }

    function rdpOnPointerUpdate(idx, xorBpp, hotX, hotY, w, h, andMask, xorData) {
      const css = buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData);
      if (!css) return;
      pointerCache.set(idx, css);
      canvas.style.cursor = css;
    }

    // buildCursorCss rasterises an MS-RDPBCGR pointer (§2.2.9.1.1.4.4) into a
    // CSS `url(...) hotX hotY, default` cursor value.  AND/XOR mask data
    // arrives top-down (grdp flips it server-side).
    function buildCursorCss(xorBpp, hotX, hotY, w, h, andMask, xorData) {
      if (w <= 0 || h <= 0) return null;
      const off = ('OffscreenCanvas' in window)
        ? new OffscreenCanvas(w, h)
        : Object.assign(document.createElement('canvas'), { width: w, height: h });
      const octx = off.getContext('2d');
      const img = octx.createImageData(w, h);
      const px = img.data;

      // AND mask: 1bpp, padded to 2-byte stride per scanline.
      const andStride = (((w + 15) >> 4) << 1);
      const andBit = (x, y) => {
        const off = y * andStride + (x >> 3);
        if (off >= andMask.length) return 1; // missing → transparent
        return (andMask[off] >> (7 - (x & 7))) & 1;
      };

      if (xorBpp === 1) {
        // Monochrome: XOR mask is 1bpp, same stride rules as AND.
        const xorStride = andStride;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const a = andBit(x, y);
            const xo = xorStride * y + (x >> 3);
            const xb = xo < xorData.length
              ? (xorData[xo] >> (7 - (x & 7))) & 1
              : 0;
            const o = (y * w + x) << 2;
            // (AND, XOR): 00 black, 01 white, 10 transparent, 11 invert→black.
            if (a === 0 && xb === 0)      { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
            else if (a === 0 && xb === 1) { px[o]=255; px[o+1]=255; px[o+2]=255; px[o+3]=255; }
            else if (a === 1 && xb === 0) { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=0;   }
            else                          { px[o]=0;   px[o+1]=0;   px[o+2]=0;   px[o+3]=255; }
          }
        }
      } else if (xorBpp === 32) {
        // BGRA32, alpha takes precedence over AND mask (modern Windows path).
        const stride = w * 4;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 4;
            const o = (y * w + x) << 2;
            if (s + 3 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            const b = xorData[s], g = xorData[s+1], r = xorData[s+2], a = xorData[s+3];
            if (a !== 0) {
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=a;
            } else if (andBit(x, y) === 0) {
              // AND=0 with alpha=0 means opaque-color-but-no-alpha-channel
              // (some servers leave alpha as 0); fall back to AND mask.
              px[o]=r; px[o+1]=g; px[o+2]=b; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else if (xorBpp === 24) {
        // BGR24, AND mask provides transparency. Stride padded to 2 bytes
        // per grdp's flip (matches xorStride = ((w*24 + 15)/16)*2 = w*3 padded).
        const stride = ((w * 3 + 1) >> 1) << 1;
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const s = y * stride + x * 3;
            const o = (y * w + x) << 2;
            if (s + 2 >= xorData.length) {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
              continue;
            }
            if (andBit(x, y) === 0) {
              px[o]=xorData[s+2]; px[o+1]=xorData[s+1]; px[o+2]=xorData[s]; px[o+3]=255;
            } else {
              px[o]=0; px[o+1]=0; px[o+2]=0; px[o+3]=0;
            }
          }
        }
      } else {
        // Unsupported depth (15/16bpp etc.): leave canvas transparent so the
        // cursor hides rather than rendering garbage.
        console.warn('Unsupported cursor xorBpp:', xorBpp);
      }

      // Mitigation: xrdp color cursors can come with an all-zero AND mask -> the whole
      // rectangle is fully opaque, the cursor shape's (arrow/spinner/text) transparent
      // outline is lost and it renders as a black block. A real cursor always has
      // transparent areas (at least the corners); detect ">=95% opaque" and drop that
      // cursor, keeping the previous (or default) one.
      {
        let opaque = 0, total = w * h;
        for (let o = 3; o < px.length; o += 4) if (px[o] !== 0) opaque++;
        if (total > 0 && opaque >= total * 0.95) {
          console.warn('cursor fully opaque (xrdp AND=0), ignoring', w, 'x', h);
          return null;
        }
      }

      octx.putImageData(img, 0, 0);
      // OffscreenCanvas doesn't expose toDataURL; copy through a regular canvas.
      let dataUrl;
      if (off instanceof HTMLCanvasElement) {
        dataUrl = off.toDataURL('image/png');
      } else {
        const tmp = document.createElement('canvas');
        tmp.width = w; tmp.height = h;
        tmp.getContext('2d').drawImage(off, 0, 0);
        dataUrl = tmp.toDataURL('image/png');
      }
      // Clamp hotspot to bitmap bounds — some servers ship out-of-range values.
      const hx = Math.max(0, Math.min(w - 1, hotX|0));
      const hy = Math.max(0, Math.min(h - 1, hotY|0));
      return `url("${dataUrl}") ${hx} ${hy}, default`;
    }

    // ── WASM bootstrap ────────────────────────────────────────────────────────
    // At runtime main.wasm is race-downloaded from CDNs via justget (the package tarball
    // ships the wasm for jsDelivr distribution, but postinstall removes the local copy —
    // same idea as the service-tunnels face-api model).
    // Override: URL ?wasm=<url> or localStorage['grdpwasm.wasmUrl']; default CDN -> same-origin fallback.
    const PKG_VERSION = "0.2.0";
    function wasmSources() {
      const custom = new URLSearchParams(location.search).get("wasm")
        || localStorage.getItem("grdpwasm.wasmUrl");
      if (custom) return [custom];
      // CDN first (release convention: publish to npmjs after debugging; the CDN then
      // serves the latest). Until published it 404s -> same-origin main.wasm fallback.
      // ⚠️ Before publishing, PKG_VERSION must be bumped together with package.json
      // (prepack syncs it via scripts/sync-version.mjs), otherwise the CDN keeps an
      // old decoder and the page silently runs the stale wasm.
      return [
        `https://cdn.jsdelivr.net/npm/@aiti-ai/grdpwasm@${PKG_VERSION}/static/main.wasm`,
        `https://unpkg.com/@aiti-ai/grdpwasm@${PKG_VERSION}/static/main.wasm`,
        "main.wasm",
      ];
    }
    async function fetchPlain(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`HTTP ${r.status} ${url}`);
      return new Uint8Array(await r.arrayBuffer());
    }
    async function bootWasm() {
      const status = document.getElementById("status");
      const [url, ...mirrors] = wasmSources();
      const cdnMirrors = mirrors.filter(m => /^https?:/.test(m));
      let bytes;
      if (window.justget && window.justget.download && /^https?:/.test(url)) {
        try {
          // justget: multi-mirror racing + localStorage learning cache (fastest source wins next time)
          const result = await window.justget.download({ url, mirrors: cdnMirrors });
          bytes = result.data instanceof Blob ? new Uint8Array(await result.data.arrayBuffer()) : result.data;
        } catch { /* all CDNs failed -> same-origin fallback below */ }
      }
      if (!bytes) {
        // try every source one by one (same-origin main.wasm included; CDN sources get one retry, they fail fast)
        let lastErr;
        for (const u of [url, ...mirrors]) {
          try { bytes = await fetchPlain(u); break; } catch (e) { lastErr = e; }
        }
        if (!bytes) throw lastErr || new Error("no wasm source");
      }
      const result = await WebAssembly.instantiate(bytes, go.importObject);
      go.run(result.instance);
      status.textContent = "Ready";
    }
    bootWasm().catch(e => {
      document.getElementById("status").textContent = "WASM load failed: " + e;
    });

    const ub = document.getElementById("unlockBtn");
    if (ub) ub.addEventListener("click", () => {
      if (typeof rdpUnlock === "function") { rdpUnlock(); setStatus("Unlock sequence sent"); }
    });
    const rb = document.getElementById("redrawBtn");
    if (rb) rb.addEventListener("click", () => {
      if (typeof rdpRedraw === "function") { rdpRedraw(); setStatus("Full redraw requested…"); }
    });

    function proxyURL() {
      // Derive the base path the page lives under (e.g. /aiti-ui-env/rdp or /dev/aiti-ui-env/rdp)
      // so the WS connects to /ws under the same base (rewritten to rdp-bridge by the pi-web middleware).
      const base = location.pathname.endsWith("/index.html")
        ? location.pathname.slice(0, -"/index.html".length)
        : location.pathname;
      return (location.protocol === "https:" ? "wss://" : "ws://") + location.host + base;
    }

    function toggleConnect() {
      if (connected) {
        rdpDisconnect();
        setDisconnected("Disconnected");
      } else {
        doConnect();
      }
    }

    function doConnect() {
      // host/port: injected by the server via __rdpTarget (fixedTarget mode);
      // standalone mode reads hidden DOM fields (invisible and non-editable for the user)
      const host = (window.__rdpTarget && window.__rdpTarget.host) || document.getElementById("host").value.trim();
      const port = String((window.__rdpTarget && window.__rdpTarget.port) || document.getElementById("port").value.trim() || 3389);
      const domain   = document.getElementById("domain").value.trim();
      const user     = document.getElementById("user").value.trim();
      const password = document.getElementById("password").value;
      const width    = parseInt(document.getElementById("width").value) || 1280;
      const height   = parseInt(document.getElementById("height").value) || 800;

      saveCookies();
      try { sessionStorage.setItem("grdp.creds", JSON.stringify({ domain, user, password, width, height })); } catch (_) {}

      // (Re)create the H.264 decoder sized for this session.
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} }
      h264Dec = createH264Decoder(width, height);
      h264Timestamp = 0;
      h264FramePos.clear();

      // Reset cursor state for the new session.
      pointerCache.clear();
      canvas.style.cursor = 'default';

      // Create AudioContext here, while we're in a user-gesture handler,
      // so the browser starts it in 'running' state (no autoplay suspension).
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} }
      audioCtx = new AudioContext({ latencyHint: 'playback' });
      audioNextAt = 0;
      if (h264Dec) {
        document.getElementById("status").textContent = "Connecting… (WebCodecs H.264 enabled)";
      } else {
        document.getElementById("status").textContent = "Connecting… (WebCodecs unavailable)";
      }
      rdpConnect(proxyURL(), host, port, domain, user, password, width, height,
        document.getElementById("swapAltMeta").checked);
    }

    // Callbacks from WASM
    function rdpOnReady() {
      try { sessionStorage.setItem("grdp.reconnects", "0"); } catch (_) {}
      connected = true;
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Disconnect";
      const ub = document.getElementById("unlockBtn");
      if (ub) ub.style.display = "";
      const rb = document.getElementById("redrawBtn");
      if (rb) rb.style.display = "";
      btn.classList.add("connected");
      document.getElementById("status").textContent =
        h264Dec ? "Connected (WebCodecs H.264)" : "Connected";
      document.getElementById("rdpCanvas").focus();
    }

    function setStatus(msg) {
      document.getElementById("status").textContent = msg;
    }
    function rdpOnError(msg) {
      setDisconnected("Error: " + msg);
      scheduleAutoReconnect();
    }

    function rdpOnClose() {
      setDisconnected("Closed");
      scheduleAutoReconnect();
    }

    // Auto-recovery on disconnect: in autoconnect mode (bridge/server dropped, lock-screen
    // kick, ...) reload the whole page after 4s — credentials live in sessionStorage and
    // are re-filled + reconnected after reload. A backstop beyond the Go-side watchdog
    // covering every disconnect shape.
    var reconnectTimer = null;
    function scheduleAutoReconnect() {
      let creds = null;
      try { creds = JSON.parse(sessionStorage.getItem("grdp.creds") || "null"); } catch (_) {}
      if (!creds || !creds.user) return;
      if (reconnectTimer) return;
      // Retry cap: at most 3 auto-reconnects per page lifetime (a successful connect does
      // NOT reset the counter — otherwise a "connects then instantly drops" loop never
      // ends). Past the cap a persistent error message is shown.
      let n = 0;
      try { n = parseInt(sessionStorage.getItem("grdp.reconnects") || "0"); } catch (_) {}
      if (n >= 3) {
        setStatus("Disconnected (3 retries exhausted). Likely causes: wrong password, session taken over elsewhere (single-session limit), or the target refused the connection. Check credentials and press Connect manually.");
        return;
      }
      try { sessionStorage.setItem("grdp.reconnects", String(n + 1)); } catch (_) {}
      setStatus("Reconnecting… (attempt " + (n + 1) + "/3)");
    }
    // load-time restore: prefill from sessionStorage when the form is empty
    // and a fixed target is present (aiti-ui-env deployments).
    (function restoreCreds() {
      let creds = null;
      try { creds = JSON.parse(sessionStorage.getItem("grdp.creds") || "null"); } catch (_) { return; }
      if (!creds || !creds.user) return;
      const tryFill = () => {
        const u = document.getElementById("user"), p = document.getElementById("password");
        if (!u || !p) { setTimeout(tryFill, 300); return; }
        if (!u.value) u.value = creds.user;
        if (!p.value) p.value = creds.password;
        const d = document.getElementById("domain");
        if (d && !d.value && creds.domain) d.value = creds.domain;
      };
      tryFill();
    })();

    // Server → client: write text to browser clipboard (text only).
    function rdpOnClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).catch(err => {
          console.warn("clipboard write failed:", err);
        });
      }
    }

    function setDisconnected(msg) {
      connected = false;
      if (typeof vkb !== "undefined") vkb.reset(); // release latched modifiers
      if (typeof scb !== "undefined") scb.release(); // release any held shortcut-bar combo
      if (audioCtx) { try { audioCtx.close(); } catch (_) {} audioCtx = null; audioNextAt = 0; }
      if (h264Dec) { try { h264Dec.close(); } catch (_) {} h264Dec = null; }
      h264FramePos.clear();
      const btn = document.getElementById("connectBtn");
      btn.textContent = "Connect";
      btn.classList.remove("connected");
      const ub = document.getElementById("unlockBtn");
      if (ub) ub.style.display = "none";
      const rb = document.getElementById("redrawBtn");
      if (rb) rb.style.display = "none";
      document.getElementById("status").textContent = msg;
    }

    // Mouse / keyboard events
    // When the canvas is CSS-scaled, convert viewport coords back to remote pixel coords
    function canvasRemoteXY(e) {
      const r = canvas.getBoundingClientRect();
      const sx = canvas.width / r.width;
      const sy = canvas.height / r.height;
      return [Math.floor((e.clientX - r.left) * sx), Math.floor((e.clientY - r.top) * sy)];
    }
    canvas.addEventListener("mousemove", e => {
      if (!connected) return;
      const [x, y] = canvasRemoteXY(e);
      rdpMouseMove(x, y);
    });

    canvas.addEventListener("mousedown", e => {
      if (!connected) return;
      e.preventDefault();
      canvas.focus();
      const r = canvas.getBoundingClientRect();
      // grdp button: 0=left, 1=middle, 2=right  (JS: 0=left, 1=middle, 2=right)
      const [mx, my] = canvasRemoteXY(e);
      rdpMouseDown(e.button, mx, my);
    });

    canvas.addEventListener("mouseup", e => {
      if (!connected) return;
      e.preventDefault();
      const r = canvas.getBoundingClientRect();
      const [ux, uy] = canvasRemoteXY(e);
      rdpMouseUp(e.button, ux, uy);
    });

    canvas.addEventListener("wheel", e => {
      if (!connected) return;
      e.preventDefault();
      // Normalize browser deltaY to notch count (1.0 = one physical notch).
      // grdp's MouseWheel(delta) expects notch units and handles WHEEL_DELTA scaling.
      // Browser deltaY is positive when scrolling down; RDP wheel is positive for up.
      let delta;
      if (e.deltaMode === 1) {        // DOM_DELTA_LINE: ~3 lines per notch
        delta = -e.deltaY / 3;
      } else if (e.deltaMode === 2) { // DOM_DELTA_PAGE
        delta = -e.deltaY;
      } else {                        // DOM_DELTA_PIXEL: ~100 px per notch
        delta = -e.deltaY / 100;
      }
      rdpMouseWheel(delta);
    }, { passive: false });

    canvas.addEventListener("contextmenu", e => e.preventDefault());

    // Track the in-flight clipboard read so keydown can wait for it to finish.
    let clipboardSyncPromise = Promise.resolve();

    function syncClipboard() {
      if (!connected || !navigator.clipboard || !navigator.clipboard.readText) return;
      // pointerdown is a user gesture; Chrome will prompt for clipboard-read
      // permission on first use and read silently thereafter.
      clipboardSyncPromise = navigator.clipboard.readText()
        .then(text => { if (text) rdpClipboardChanged(text); })
        .catch(() => {});
    }

    // ── native (system) keyboard: captured via a hidden input, forwarded to RDP ──
    const sysKbBtn = document.getElementById("sysKbBtn");
    const nativeInput = document.getElementById("nativeKbInput");
    let sysKbActive = false;

    sysKbBtn.addEventListener("click", () => {
      sysKbActive = !sysKbActive;
      sysKbBtn.classList.toggle("on", sysKbActive);
      if (sysKbActive) {
        // open the system keyboard: focus the hidden input; mobile pops the native keyboard
        nativeInput.value = "";
        nativeInput.focus();
      } else {
        nativeInput.blur();
      }
    });

    // Forward native-keyboard input to RDP
    nativeInput.addEventListener("input", () => {
      if (!connected || !sysKbActive) return;
      const text = nativeInput.value;
      if (!text) return;
      // send to RDP char by char
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const code = charToKeyCode(ch);
        if (code) {
          rdpKeyDown(code);
          rdpKeyUp(code);
        }
      }
      nativeInput.value = ""; // clear, ready for the next char
    });

    // char -> DOM code map (common chars, falls through when missing)
    function charToKeyCode(ch) {
      const map = {
        'a':'KeyA','b':'KeyB','c':'KeyC','d':'KeyD','e':'KeyE','f':'KeyF','g':'KeyG',
        'h':'KeyH','i':'KeyI','j':'KeyJ','k':'KeyK','l':'KeyL','m':'KeyM',
        'n':'KeyN','o':'KeyO','p':'KeyP','q':'KeyQ','r':'KeyR','s':'KeyS','t':'KeyT',
        'u':'KeyU','v':'KeyV','w':'KeyW','x':'KeyX','y':'KeyY','z':'KeyZ',
        '0':'Digit0','1':'Digit1','2':'Digit2','3':'Digit3','4':'Digit4',
        '5':'Digit5','6':'Digit6','7':'Digit7','8':'Digit8','9':'Digit9',
        ' ':'Space','-':'Minus','=':'Equal','[':'BracketLeft',']':'BracketRight',
        '\\':'Backslash',';':'Semicolon',"'":'Quote',',':'Comma','.':'Period','/':'Slash',
        '`':'Backquote','\n':'Enter','\t':'Tab','\b':'Backspace',
      };
      const lower = ch.toLowerCase();
      if (map[lower]) return map[lower];
      // uppercase letters
      if (/^[A-Z]$/.test(ch)) return 'Key' + ch;
      return null;
    }

    // Sync on click: covers the common case of copying in another app then
    // clicking back into the canvas before pressing the paste key.
    canvas.addEventListener("pointerdown", syncClipboard);

    // Sync via paste event (Cmd+V on macOS, right-click paste, etc.)
    document.addEventListener("paste", e => {
      if (!connected) return;
      const text = e.clipboardData ? e.clipboardData.getData("text/plain") : "";
      if (text) rdpClipboardChanged(text);
    });

    // Await any pending clipboard sync before forwarding each key, so that a
    // pointerdown-triggered readText() always completes before reaching the server.
    canvas.addEventListener("keydown", async e => {
      if (!connected) return;
      e.preventDefault();
      await clipboardSyncPromise;
      rdpKeyDown(e.code);
    });

    canvas.addEventListener("keyup", e => {
      if (!connected) return;
      e.preventDefault();
      rdpKeyUp(e.code);
    });
  </script>

  <!-- virtual keyboard (simple-keyboard engine + programmer layout + unified dispatch layer) -->
  <script src="vendor/simple-keyboard.js"></script>
  <script src="virtual-keyboard.js"></script>
  <script src="shortcut-bar.js"></script>
  <script>
    (function () {
      if (typeof SimpleKeyboard === "undefined" || typeof VirtualKeyboard === "undefined") return;
      // mount: send to RDP (Go globals rdpKeyDown/rdpKeyUp map DOM code -> scancode)
      const vkb = VirtualKeyboard.mount({
        root: "#vkbRoot",
        onKey(code, down) {
          if (!connected) return;
          if (down) rdpKeyDown(code); else rdpKeyUp(code);
        },
        onLatch(code, on) {
          if (!connected) return;
          if (on) rdpKeyDown(code); else rdpKeyUp(code);
        }
      });
      window.vkb = vkb;
      const btn = document.getElementById("vkbToggle");
      btn.addEventListener("click", () => {
        vkb.toggle();
        btn.classList.toggle("on", vkb.isOpen());
        document.body.classList.toggle("vkb-open", vkb.isOpen());
        if (vkb.isOpen()) {
          const el = document.getElementById("vkbRoot");
          document.body.style.setProperty("--vkb-hpx", el.offsetHeight + "px");
        }
      });
    })();
  </script>

  <!-- shortcut bar (F1–F12 / Alt+Tab / Ctrl+Alt+T / ⊞ Win / ⇧+F10 …; sent to RDP via the same dispatch layer as the virtual keyboard) -->
  <script>
    (function () {
      if (typeof ShortcutBar === "undefined") return;
      const scb = ShortcutBar.mount({
        root: "#shortcuts",
        onPress(code) { if (!connected) return; rdpKeyDown(code); },
        onRelease(code) { if (!connected) return; rdpKeyUp(code); }
      });
      window.scb = scb;
      const btn = document.getElementById("scbToggle");
      const el = document.getElementById("shortcuts");
      btn.addEventListener("click", () => {
        el.hidden = !el.hidden;
        btn.classList.toggle("on", !el.hidden);
        if (el.hidden) scb.release(); // release held combos when collapsed
      });
    })();
  </script>
</body>
</html>
